<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B3DFF"/>
      <stop offset="100%" stop-color="#5B1FBF"/>
    </linearGradient>
    <linearGradient id="accent" x1="160" y1="340" x2="360" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5E642"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Stylized "Z" formed by a trending-up chart line -->
  <!-- Top horizontal bar of Z -->
  <line x1="140" y1="150" x2="372" y2="150" stroke="url(#accent)" stroke-width="40" stroke-linecap="round"/>
  <!-- Diagonal of Z (trending up from bottom-left to top-right, reversed for Z) -->
  <line x1="372" y1="150" x2="140" y2="362" stroke="url(#accent)" stroke-width="40" stroke-linecap="round"/>
  <!-- Bottom horizontal bar of Z -->
  <line x1="140" y1="362" x2="372" y2="362" stroke="url(#accent)" stroke-width="40" stroke-linecap="round"/>
  <!-- Small upward arrow tick at top-right of Z to suggest growth -->
  <polyline points="340,120 372,90 404,120" stroke="#F5E642" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

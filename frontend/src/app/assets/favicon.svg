<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B3DFF"/>
      <stop offset="100%" stop-color="#5B1FBF"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background matching navbar logo -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- TrendingUp line (lucide style) -->
  <polyline
    points="5,22 12,14 17,19 27,9"
    stroke="white"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Arrow head on top-right -->
  <polyline
    points="21,9 27,9 27,15"
    stroke="white"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
